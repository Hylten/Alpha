backend:
  name: github
  repo: Hylten/Alpha
  branch: main
  auth_type: implicit
  client_id: ALPHA_CLIENT_ID_PENDING

# Media-hantering
media_folder: "public/assets"
public_folder: "/Alpha/assets"

# Publiceringsläge: Git (commit+push direkt mot main via GitHub)
publish_mode: editorial_workflow

collections:
  - name: "intelligence"
    label: "Intelligence"
    label_singular: "Artikel"
    folder: "content/intelligence"
    create: true
    slug: "{{slug}}"
    identifier_field: slug
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-vänlig identitet. Ändra ej efter publicering." }
      - { label: "Beskrivning", name: "description", widget: "text" }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD" }
      - { label: "Taggar", name: "tags", widget: "list", default: [] }
      - { label: "Kategorier", name: "categories", widget: "list", default: ["Intelligence"] }
      - { label: "Canonical URL", name: "canonical_url", widget: "string", required: false }
      - { label: "Meta-titel", name: "meta_title", widget: "string", required: false }
      - { label: "Meta-beskrivning", name: "meta_description", widget: "text", required: false }
      - { label: "Utvald bild", name: "featured_image", widget: "image", required: false }
      - { label: "Utkast (draft)", name: "draft", widget: "boolean", default: true }
      - { label: "Författare", name: "author", widget: "string" }
      - { label: "Innehåll", name: "body", widget: "markdown" }
